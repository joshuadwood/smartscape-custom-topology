# OpenPipeline: Davis Events Pipeline - Metric Extraction from topology events
schemaId: builtin:openpipeline.davis.events.pipelines
scope: environment
value:
    customId: topology_builder_metrics
    displayName: "Topology Builder - Metric Extraction"
    routing: routable
    metricExtraction:
      processors:
        - id: extract_topology_counter
          type: counterMetric
          enabled: true
          description: "Extract counter metric from custom topology events"
          matcher: 'matchesPhrase(event.name, "custom.topology")'
          counterMetric:
            metricKey: "custom.topology.edge.count"
            dimensions:
              - extractionType: field
                sourceFieldName: "dt.entity.service"
